{% load static %}
{% include 'inc/header.html' %}

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0 text-center">
                    <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                        <i class="bi bi-shield-lock fs-2"></i>
                    </div>
                    <h4 class="fw-bold text-dark mb-0">Cambiar Contraseña</h4>
                    <p class="text-muted small mt-1">Actualiza tus credenciales de acceso al sistema.</p>
                </div>
                
                <div class="card-body p-4">
                    <form method="POST" action="{% url 'cambiar_clave' %}" autocomplete="off">
                        {% csrf_token %}
                        
                        <!-- Contraseña Actual -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark">
                                Contraseña Actual
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" id="clave_actual" name="clave_actual" class="form-control border-start-0 ps-0" placeholder="Escribe tu clave actual" required autocomplete="current-password">
                                <button class="btn btn-outline-secondary" type="button" onclick="toggleVisibilidad('clave_actual', 'icono_clave_actual', this)" aria-label="Mostrar contraseña actual" aria-pressed="false">
                                    <i class="bi bi-eye-slash" id="icono_clave_actual" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <hr class="my-4 text-muted">

                        <!-- Nueva Contraseña -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark">
                                Nueva Contraseña
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="nueva_clave" name="nueva_clave" class="form-control border-start-0 ps-0" placeholder="Crea una nueva clave" minlength="6" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary" type="button" onclick="toggleVisibilidad('nueva_clave', 'icono_nueva_clave', this)" aria-label="Mostrar nueva contraseña" aria-pressed="false">
                                    <i class="bi bi-eye-slash" id="icono_nueva_clave" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Confirmar Nueva Contraseña -->
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-dark">
                                Confirmar Nueva Contraseña
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-check-circle text-muted"></i></span>
                                <input type="password" id="confirmar_clave" name="confirmar_clave" class="form-control border-start-0 ps-0" placeholder="Repite la clave" minlength="6" required autocomplete="new-password">
                                <button class="btn btn-outline-secondary" type="button" onclick="toggleVisibilidad('confirmar_clave', 'icono_confirmar_clave', this)" aria-label="Mostrar confirmación de contraseña" aria-pressed="false">
                                    <i class="bi bi-eye-slash" id="icono_confirmar_clave" aria-hidden="true"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm">
                                <i class="bi bi-save me-1"></i> Actualizar Contraseña
                            </button>
                            <a href="{% url 'inicio' %}" class="btn btn-light fw-semibold py-2">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
    function toggleVisibilidad(inputId, iconoId, boton) {
        const campo = document.getElementById(inputId);
        const icono = document.getElementById(iconoId);
        const mostrar = campo.type === 'password';

        campo.type = mostrar ? 'text' : 'password';
        icono.classList.toggle('bi-eye', mostrar);
        icono.classList.toggle('bi-eye-slash', !mostrar);
        boton.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
        boton.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }
</script>

{% include 'inc/footer.html' %}
